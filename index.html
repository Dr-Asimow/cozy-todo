<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌷 Cozy Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Giriş / Kayıt ekranı -->
  <div class="app auth-card" id="auth-view" hidden>
    <header class="app-header">
      <h1>🌷 Cozy Todo</h1>
      <p class="subtitle" id="auth-subtitle">Hesabına giriş yap ☕</p>
    </header>

    <form id="auth-form" class="auth-form">
      <input type="email" id="email" placeholder="E-posta" autocomplete="email" required />
      <input type="password" id="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password" minlength="6" required />
      <p class="auth-error" id="auth-error" hidden></p>
      <button type="submit" id="auth-submit">Giriş yap</button>
    </form>

    <p class="auth-switch">
      <span id="auth-switch-text">Hesabın yok mu?</span>
      <button type="button" id="auth-toggle" class="link-btn">Kayıt ol</button>
    </p>
  </div>

  <!-- Todo uygulaması -->
  <div id="app-view" class="board" hidden>
    <!-- Sütun 1: Profil -->
    <section class="app column">
      <header class="app-header"><h1>👤 Profil</h1></header>
      <!-- Profil -->
      <div class="profile" id="profile">
        <div class="avatar" id="profile-avatar"></div>
        <div class="profile-info">
          <span class="profile-name" id="profile-name">Kullanıcı</span>
          <span class="profile-email" id="profile-email"></span>
        </div>
        <div class="profile-actions">
          <button type="button" id="profile-edit-btn" class="link-btn">Düzenle</button>
          <button type="button" id="logout-btn" class="link-btn">Çıkış</button>
        </div>
      </div>

      <!-- Profil düzenleme paneli -->
      <form class="profile-edit" id="profile-edit" hidden>
        <div class="avatar-edit">
          <div class="avatar avatar-lg" id="avatar-preview"></div>
          <label class="avatar-upload-btn">
            Görsel seç
            <input type="file" id="avatar-input" accept="image/*" hidden />
          </label>
        </div>
        <label class="field">İsim
          <input type="text" id="edit-name" placeholder="Görünen ad" maxlength="40" />
        </label>
        <label class="field">Yeni şifre
          <input type="password" id="edit-password" placeholder="Boş bırakırsan değişmez" autocomplete="new-password" minlength="6" />
        </label>
        <label class="field">Yeni şifre (tekrar)
          <input type="password" id="edit-password2" placeholder="Şifreyi tekrar gir" autocomplete="new-password" />
        </label>
        <p class="profile-msg" id="profile-msg" hidden></p>
        <div class="profile-edit-actions">
          <button type="submit" class="pomo-btn primary" id="profile-save">Kaydet</button>
          <button type="button" class="pomo-btn" id="profile-cancel">Vazgeç</button>
        </div>
      </form>
    </section>

    <!-- Sütun 2: Pomodoro -->
    <section class="app column">
      <header class="app-header"><h1>🍅 Pomodoro</h1></header>
      <!-- Pomodoro zamanlayıcı -->
      <section class="pomodoro" id="pomodoro">
      <div class="pomo-modes">
        <button type="button" class="pomo-mode active" data-mode="work">Çalışma</button>
        <button type="button" class="pomo-mode" data-mode="short">Kısa Mola</button>
        <button type="button" class="pomo-mode" data-mode="long">Uzun Mola</button>
      </div>
      <div class="pomo-time" id="pomo-time">25:00</div>
      <div class="pomo-round" id="pomo-round">1. tur • çalışma</div>
      <div class="pomo-controls">
        <button type="button" id="pomo-toggle" class="pomo-btn primary">Başlat</button>
        <button type="button" id="pomo-reset" class="pomo-btn">Sıfırla</button>
        <button type="button" id="pomo-settings-toggle" class="pomo-btn ghost" aria-label="Ayarlar" title="Ayarlar">⚙</button>
      </div>
      <form class="pomo-settings" id="pomo-settings" hidden>
        <label>Çalışma (dk)
          <input type="number" id="set-work" min="1" max="180" />
        </label>
        <label>Kısa mola (dk)
          <input type="number" id="set-short" min="1" max="60" />
        </label>
        <label>Uzun mola (dk)
          <input type="number" id="set-long" min="1" max="120" />
        </label>
        <label>Kaç turda bir uzun mola
          <input type="number" id="set-every" min="1" max="12" />
        </label>
      </form>
      </section>
    </section>

    <!-- Sütun 3: Yapılacaklar -->
    <section class="app column">
      <header class="app-header">
        <h1>🌷 Yapılacaklar</h1>
        <p class="subtitle">Bugün kendine iyi davran ☕</p>
      </header>

      <form id="todo-form" class="todo-form">
      <input type="text" id="todo-input" placeholder="Ne yapmak istersin?" autocomplete="off" />
      <button type="submit" aria-label="Ekle">＋</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Tümü</button>
      <button class="filter-btn" data-filter="active">Aktif</button>
      <button class="filter-btn" data-filter="done">Bitenler</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="app-footer">
      <span id="counter">0 görev</span>
      <button id="clear-done" class="clear-btn">Bitenleri temizle</button>
      </footer>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
